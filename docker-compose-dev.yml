services:
  postgres:
    image: postgres:16
    container_name: scuola-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: scuola
      POSTGRES_PASSWORD: scuola_pass
      POSTGRES_DB: db_materie
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data: 