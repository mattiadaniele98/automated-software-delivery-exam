name: CI

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:

  # Build, test e analisi statica
  build:
    name: Build, Test e Analisi Statica
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_materie
          POSTGRES_USER: scuola
          POSTGRES_PASSWORD: scuola_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # validate → Checkstyle
      # compile  → compilazione
      # test     → test unitari + JaCoCo report
      # package  → crea il JAR
      # verify   → JaCoCo check + PMD + SpotBugs
      - name: Build, test e analisi statica
        run: ./mvnw verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/db_materie
          DB_USER: scuola
          DB_PASSWORD: scuola_pass
          SPRING_PROFILES_ACTIVE: sviluppo

  # Build e push dell'immagine Docker su GitHub Container Registry
  # Parte solo dopo il job "build" e solo per un push reale su main
  # (cioè dopo il merge della PR dev -> main, non durante l'apertura della PR)
  docker:
    name: Build e Push Immagine Docker
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # packages: write richiede anche che il repository abbia
    # "Workflow permissions" impostato su "Read and write permissions"
    # in Settings -> Actions -> General, altrimenti il push su ghcr.io
    # fallisce con "denied: permission_denied: write_package"
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Login su GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/materie-service:latest
