server.port=9000
spring.application.name=materie-service

# questa riga andrebbe commentata poichè così ha la priorità sul dockercompose e non permette di attivare il profilo produzione.
spring.profiles.active=sviluppo

# Database PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_materie}
spring.datasource.username=${DB_USER:scuola}
spring.datasource.password=${DB_PASSWORD:scuola_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# "update" crea/aggiorna automaticamente le tabelle: comodo in sviluppo,
# in produzione andrebbe usato "validate" per evitare modifiche silenziose al DB.
spring.jpa.hibernate.ddl-auto=update

# In produzione andrebbero impostate a "false" per non loggare le query SQL.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Chiave segreta condivisa tra i microservizi per validare il token (hex a 64 caratteri = 256 bit).
jwt.chiave-segreta=${JWT_CHIAVE_SEGRETA:4f7dca55901487f2df866a449e1716db88181900c248dcc83fe96fd3e70deb6a}

# Durata del token in millisecondi (default: 1 ora)
jwt.durata-ms=${JWT_DURATA_MS:3600000}

# Swagger / OpenAPI
app.version=1.0.0
app.description=Microservizio per la gestione del catalogo materie scolastiche

# Versioning filter: converte /materie in /api/v1/materie in modo trasparente
forward.version.from=/materie, /materie-classe
forward.version.to=/api/v1/materie, /api/v1/materie-classe
